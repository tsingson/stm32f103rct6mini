
CONFIG_GPIO=y
# SPI
CONFIG_SPI=y
#
CONFIG_PRINTK=y
# 允许在 printk 中打印浮点数 (可选，如果想打印真实 m/s^2)
CONFIG_CBPRINTF_FP_SUPPORT=y

#
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=4
# 开启串口和外设的独立控制
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ==================== 针对 Zephyr 4.4.1 的全量完全体显示驱动配置 ====================
# I2C ssd1306
CONFIG_I2C=y
# 1. 激活 Zephyr 内核的总显示模块接口
CONFIG_DISPLAY=y
# 2. 【核心修复】显式将 ssd1306 的物理驱动源码打包进编译树
CONFIG_SSD1306=y
# 3. 激活基于字符的帧缓冲区
CONFIG_CHARACTER_FRAMEBUFFER=y

# 4. 现代电源管理支持
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
